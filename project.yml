name: GuwapiNotes
options:
  bundleIdPrefix: com.guwapi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  GuwapiNotes:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/GuwapiNotes.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: guwapi notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        NSCameraUsageDescription: Camera e folosită pentru scanarea documentelor și extragerea textului în note.
        NSPhotoLibraryAddUsageDescription: Pentru salvarea imaginilor din note.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.guwapi.notes
            CFBundleURLSchemes: [guwapinotes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guwapi.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GuwapiWidget
  GuwapiWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/GuwapiWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: guwapi notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guwapi.notes.widget
