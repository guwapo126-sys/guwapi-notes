name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unelte
        run: brew install xcodegen ldid

      - name: Generează proiectul Xcode
        run: xcodegen generate

      - name: Compilează (fără semnătură)
        run: |
          xcodebuild \
            -project GuwapiNotes.xcodeproj \
            -target GuwapiNotes \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Atașează entitlements și împachetează .ipa
        run: |
          APP="build/Release-iphoneos/GuwapiNotes.app"
          test -d "$APP/PlugIns/GuwapiWidget.appex" || { echo "Widgetul nu a fost inclus"; exit 1; }
          # iloader/SideStore citesc entitlements din binar ca să creeze App Group-ul
          ldid -SWidget/GuwapiWidget.entitlements "$APP/PlugIns/GuwapiWidget.appex/GuwapiWidget"
          ldid -SApp/GuwapiNotes.entitlements "$APP/GuwapiNotes"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GuwapiNotes.ipa Payload
          ls -lh GuwapiNotes.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GuwapiNotes-ipa
          path: GuwapiNotes.ipa
          retention-days: 30
